[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmaker-firmware-tools"
version = "0.1.0"
description = "Tools for creating and manipulating Snapmaker U1 firmware images"
readme = "README.md"
authors = [{ name = "paxx12" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "crcmod",
]
requires-python = ">=3.6"

[project.scripts]
sm-upfile = "firmware_tools.sm_upfile:main"
rk-afptool = "firmware_tools.rk_afptool:main"
rk-resource-image = "firmware_tools.rk_resource_image:main"
rk-update-image = "firmware_tools.rk_update_image:main"

[tool.setuptools.packages.find]
where = ["src"]
