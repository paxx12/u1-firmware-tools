name: CI

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Download test firmware
      run: |
        echo "Downloading firmware..."
        wget -q "https://public.resource.snapmaker.com/firmware/U1/U1_1.1.0.105_20260124180406_upgrade.bin" -O firmware.bin
        ls -lh firmware.bin

    - name: Run Repack Test
      run: |
        chmod +x test/test_repack.sh
        ./test/test_repack.sh firmware.bin
